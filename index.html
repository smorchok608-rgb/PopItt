const BUBBLES=[[310, 406, 29], [143, 529, 27], [280, 56, 30], [211, 607, 31], [245, 472, 27], [204, 256, 29], [334, 606, 27], [309, 340, 29], [272, 608, 26], [464, 220, 29], [260, 778, 26], [283, 539, 26], [360, 256, 25], [379, 766, 25], [146, 664, 29], [244, 406, 28], [125, 596, 27], [220, 68, 30], [245, 342, 30], [453, 794, 22], [91, 220, 25], [228, 539, 33], [308, 472, 33], [260, 831, 26], [280, 116, 31], [336, 75, 29], [258, 279, 26], [345, 536, 31], [140, 758, 26], [310, 280, 26], [290, 674, 28], [359, 675, 33], [237, 674, 25], [105, 788, 26]];
const RESTORE_MS=30000;
const NS="http://www.w3.org/2000/svg";
const defs=document.getElementById("defs"), layer=document.getElementById("bubbles");

// ---- sound (мягкий, почти АСМР) ----
let ctx=null, master=null, wet=null;
function audio(){
  if(!ctx){
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=.8;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
      master.connect(comp); comp.connect(ctx.destination);
      // лёгкая «комнатная» реверберация из сгенерированного импульса
      const len=Math.floor(ctx.sampleRate*1.1), ir=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
      const conv=ctx.createConvolver(); conv.buffer=ir;
      wet=ctx.createGain(); wet.gain.value=.28;
      const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
      conv.connect(lp); lp.connect(wet); wet.connect(master);
      ctx._conv=conv;
    }catch(e){}
  }
  if(ctx&&ctx.state==="suspended")ctx.resume();
  return ctx;
}
// ноты мягкой пентатоники (Гц) — каждая пупырка звучит «в тон»
const SCALE=[196,220,261.6,293.7,329.6,392,440];
function route(c,pan,node,send){
  let out=node;
  if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan*.7;node.connect(p);out=p;}
  out.connect(master);
  const s=c.createGain(); s.gain.value=send; out.connect(s); s.connect(c._conv);
}
function popSound(pan){
  const c=audio(); if(!c||!master)return;
  const t=c.currentTime+.005, f=SCALE[Math.floor(Math.random()*SCALE.length)]*(.99+Math.random()*.02);
  const bus=c.createGain(); bus.gain.value=1;
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1500; lp.Q.value=.5;
  lp.connect(bus);
  // основной тёплый «блуп» силикона: синус с быстрым падением тона
  const o=c.createOscillator(), g=c.createGain();
  o.type="sine"; o.frequency.setValueAtTime(f*1.5,t); o.frequency.exponentialRampToValueAtTime(f*.62,t+.11);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.42,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+.22);
  o.connect(g).connect(lp); o.start(t); o.stop(t+.25);
  // нижний «тук» — глубина
  const o2=c.createOscillator(), g2=c.createGain();
  o2.type="sine"; o2.frequency.setValueAtTime(f*.5,t); o2.frequency.exponentialRampToValueAtTime(f*.3,t+.09);
  g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(.3,t+.008); g2.gain.exponentialRampToValueAtTime(.0008,t+.14);
  o2.connect(g2).connect(bus); o2.start(t); o2.stop(t+.16);
  // очень мягкий шорох «воздуха» (без резкого щелчка)
  const len=Math.floor(c.sampleRate*.05), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*Math.min(1,k*3))*Math.pow(1-k,2);}
  const n=c.createBufferSource(); n.buffer=buf;
  const f3=c.createBiquadFilter(); f3.type="lowpass"; f3.frequency.value=1100;
  const g3=c.createGain(); g3.gain.value=.12;
  n.connect(f3).connect(g3).connect(bus); n.start(t);
  route(c,pan,bus,.5);
}
function restoreSound(pan){
  const c=audio(); if(!c||!master)return;
  const t=c.currentTime+.005, f=SCALE[Math.floor(Math.random()*4)];
  const o=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.value=1000;
  o.type="sine"; o.frequency.setValueAtTime(f*.6,t); o.frequency.exponentialRampToValueAtTime(f*1.1,t+.1);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09,t+.02); g.gain.exponentialRampToValueAtTime(.0008,t+.18);
  o.connect(g).connect(lp); o.start(t); o.stop(t+.2);
  route(c,pan,lp,.4);
}

// ---- bubbles ----
BUBBLES.forEach(([x,y,r],i)=>{
  const cr=r*1.03;
  const cp=document.createElementNS(NS,"clipPath"); cp.id="c"+i;
  const cc=document.createElementNS(NS,"circle"); cc.setAttribute("cx",x); cc.setAttribute("cy",y); cc.setAttribute("r",cr);
  cp.appendChild(cc); defs.appendChild(cp);

  const g=document.createElementNS(NS,"g"); g.dataset.i=i;
  const clipG=document.createElementNS(NS,"g"); clipG.setAttribute("clip-path","url(#c"+i+")");
  const img=document.createElementNS(NS,"image");
  img.setAttribute("href",POPPED_IMG); img.setAttribute("width",W); img.setAttribute("height",H); img.setAttribute("class","pop");
  clipG.appendChild(img);
  const ring=document.createElementNS(NS,"circle");
  ring.setAttribute("cx",x); ring.setAttribute("cy",y); ring.setAttribute("r",r); ring.setAttribute("class","ring");
  const hit=document.createElementNS(NS,"circle");
  hit.setAttribute("cx",x); hit.setAttribute("cy",y); hit.setAttribute("r",r); hit.setAttribute("class","hit");
  g.append(clipG,ring,hit); layer.appendChild(g);
  g._st={popped:false,timer:null,x,y,ring};
});

function pop(g){
  const s=g._st; if(s.popped)return;
  s.popped=true; g.classList.remove("back"); g.classList.add("popped");
  s.ring.classList.remove("go"); void s.ring.getBoundingClientRect(); s.ring.classList.add("go");
  popSound((s.x/W)*2-1);
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  s.timer=setTimeout(()=>restore(g),RESTORE_MS);
}
function restore(g){
  const s=g._st; if(!s.popped)return;
  s.popped=false; s.timer=null;
  g.classList.remove("popped"); g.classList.add("back");
  restoreSound((s.x/W)*2-1);
}

// ---- input (клик и протягивание пальцем) ----
let down=false;
const svg=document.getElementById("toy");
function hitAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el||!el.classList||!el.classList.contains("hit"))return;
  const g=el.parentNode; if(g&&g._st)pop(g);
}
svg.addEventListener("pointerdown",e=>{down=true;audio();hitAt(e);});
svg.addEventListener("pointermove",e=>{if(down)hitAt(e);});
window.addEventListener("pointerup",()=>down=false);
window.addEventListener("pointercancel",()=>down=false);
</script>
